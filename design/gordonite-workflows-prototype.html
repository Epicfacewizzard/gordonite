<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: a phone-sized app on the left, a guide on the right that names each workflow, what is clumsy today, and what to try. */
:root {
  --bg: #fbfaf7; --surface: #ffffff; --sunk: #efede7; --line: #e4e1da;
  --fg: #1d1f22; --muted: #666b72;
  --accent: #2f6f5e; --on-accent: #ffffff; --accent-soft: #e5f1ec;
  --bad: #b3261e; --bad-soft: #fde8e6;
  --warn: #8a5a00; --warn-soft: #fff3d6;
  --draft: #6a4bb0; --draft-soft: #ece6f8;
  --shadow: 0 10px 40px rgba(30, 40, 36, .16);
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16171a; --surface: #1e2024; --sunk: #0f1012; --line: #2d3036;
  --fg: #e8e6e1; --muted: #9ba0a7;
  --accent: #6fbfa8; --on-accent: #0e1512; --accent-soft: #1b2f28;
  --bad: #ff8a80; --bad-soft: #3d1f1d;
  --warn: #f0c36b; --warn-soft: #3a2f14;
  --draft: #b7a2f2; --draft-soft: #2a2342;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16171a; --surface: #1e2024; --sunk: #0f1012; --line: #2d3036;
  --fg: #e8e6e1; --muted: #9ba0a7;
  --accent: #6fbfa8; --on-accent: #0e1512; --accent-soft: #1b2f28;
  --bad: #ff8a80; --bad-soft: #3d1f1d;
  --warn: #f0c36b; --warn-soft: #3a2f14;
  --draft: #b7a2f2; --draft-soft: #2a2342;
  --shadow: 0 10px 40px rgba(0, 0, 0, .5);
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--sunk); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.4; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input { font: inherit; color: inherit; }

.wrap { height: 100%; display: flex; gap: 28px; justify-content: center; align-items: stretch;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- phone ---------- */
.phone { position: relative; width: 400px; max-width: 100%; flex: none; display: flex; flex-direction: column; background: var(--bg);
  border: 1px solid var(--line); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); min-height: 0; max-height: 880px; }
.top { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; min-height: 52px; }
.top h1 { font-family: var(--display); font-size: 21px; font-weight: 600; margin: 0; flex: 1; min-width: 0; text-wrap: balance; letter-spacing: -.01em; }
.top .sub { display: block; font-family: var(--ui); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 20px; flex: none; }
.iconbtn:hover { background: var(--sunk); color: var(--fg); }
.iconbtn[disabled] { opacity: .3; cursor: default; }
.saved { width: 9px; height: 9px; border-radius: 50%; background: #2e9e5b; flex: none; }
#screen { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 18px; }

.capbar { margin: 0 12px 8px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--muted); }
.capbar b { color: var(--accent); font-size: 20px; line-height: 1; font-weight: 500; }
.tabs { display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr; align-items: center; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 6px 8px; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px 0; border-radius: 10px; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabs .plus { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--on-accent); justify-self: center; justify-content: center; font-size: 28px; line-height: 1; padding: 0; }

/* ---------- shared pieces ---------- */
.label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; }
.label .n { font-weight: 500; letter-spacing: 0; text-transform: none; }
.label.bad { color: var(--bad); }
.label button { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--accent); }
.group { display: flex; flex-direction: column; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.task { display: flex; align-items: flex-start; }
.tick { width: 46px; height: 46px; flex: none; display: grid; place-items: center; }
.tick i { width: 21px; height: 21px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; font-style: normal; font-size: 13px; color: var(--on-accent); }
.task.done .tick i { background: var(--accent); border-color: var(--accent); }
.tbody { flex: 1; min-width: 0; padding: 11px 12px 11px 0; display: flex; flex-direction: column; gap: 4px; }
.task.done .ttext { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 5px 8px; font-size: 12.5px; color: var(--muted); align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.bad { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.chip.today { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.proj { background: var(--accent-soft); color: var(--accent); }
.chip.draft { background: var(--draft-soft); color: var(--draft); font-weight: 600; }
.chip.ok { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; width: 100%; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .chev { color: var(--muted); flex: none; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; flex: none; }
.av.big { width: 52px; height: 52px; font-size: 18px; }
.small { font-size: 12.5px; color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.pill { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; white-space: nowrap; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn { display: inline-flex; justify-content: center; align-items: center; padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.mini { padding: 5px 10px; font-size: 12.5px; border-radius: 9px; flex: none; }
.btn.block { width: 100%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card.draft { border: 1.5px dashed var(--draft); }
.card h3, .card h2 { margin: 0; font-size: 15px; }
.entry { padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.entry .when { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.scratch { width: 100%; min-height: 74px; border: 0; background: transparent; resize: none; padding: 10px 14px; outline: none; display: block; }
.pin { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--accent-soft); width: 100%; }
.pin strong { font-family: var(--display); font-size: 16px; color: var(--accent); }
.note-line { font-size: 13px; color: var(--muted); padding: 0 2px; }
.linkish { color: var(--accent); font-weight: 600; }
.seg { display: flex; gap: 4px; background: var(--sunk); padding: 3px; border-radius: 11px; }
.seg button { flex: 1; text-align: center; padding: 6px 4px; border-radius: 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
.prose { display: flex; flex-direction: column; gap: 8px; }
.prose p, .prose ul { margin: 0; }
.prose ul { padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; color: var(--muted); }
mark { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 2px; }
s { color: var(--muted); }

/* ---------- sheets ---------- */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; z-index: 5; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet::before { content: ""; width: 38px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; flex: none; }
.sheet textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; resize: none; font-size: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.inp { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; font-size: 16px; }
.newp { border: 1.5px solid var(--accent); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts .card { padding: 10px 12px; gap: 3px; }
.facts h3 { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
details.more { border-top: 1px solid var(--line); padding-top: 10px; }
details.more summary { color: var(--accent); font-weight: 600; cursor: pointer; }
details.more .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.toast { position: absolute; left: 16px; right: 16px; bottom: 132px; background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-size: 13.5px; z-index: 6; text-align: center; }

/* ---------- AI chat ---------- */
.bubble { max-width: 88%; padding: 9px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.bubble.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.toolcall { align-self: flex-start; font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 3px 9px; font-family: ui-monospace, Consolas, monospace; }

/* ---------- guide ---------- */
.guide { width: 400px; max-width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 6px 4px; }
.guide h2 { font-family: var(--display); font-size: 22px; margin: 0; letter-spacing: -.01em; }
.guide p { margin: 0; color: var(--muted); }
.flows { display: flex; flex-direction: column; gap: 4px; }
.flows button { display: flex; gap: 10px; padding: 8px 10px; border-radius: 10px; align-items: baseline; }
.flows button:hover { background: var(--surface); }
.flows button[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.flows .k { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; width: 14px; flex: none; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.gcard h3 { margin: 0; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; }
.gcard h3.b { color: var(--bad); } .gcard h3.n { color: var(--accent); } .gcard h3.t { color: var(--muted); }
.gcard ul, .gcard ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
.guidebar { display: none; }
.gclose { display: none; }

@media (max-width: 860px) {
  body { background: var(--bg); }
  .wrap { padding-block: 0; padding-left: 0; padding-right: 0; gap: 0; flex-direction: column; }
  .guidebar { display: flex; align-items: center; gap: 10px; padding-block: 7px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--sunk); font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .guidebar span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phone { width: 100%; flex: 1; border: 0; border-radius: 0; box-shadow: none; max-height: none; }
  .guide { display: none; position: fixed; inset: 0; z-index: 20; width: auto; background: var(--sunk); padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .guide.open { display: flex; }
  .gclose { display: inline-flex; align-self: flex-end; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .16s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

let DB = fresh();
const S = { tab: 'today', stack: [], day: 0, ptab: 'overview', section: 'All', tfilter: 'all', q: '', ftype: 'All', sheet: null, toast: null, flow: 0, ai: 0, mtab: 'summary', showDone: false };

/* ============ helpers ============ */
const P = (id) => DB.people[id];
const task = (id) => DB.tasks.find((t) => t.id === id);
const mine = () => DB.tasks.filter((t) => t.owner === 'me');
const theirs = (pid) => DB.tasks.filter((t) => t.owner !== 'me' && (!pid || t.project === pid));
const route = () => S.stack[S.stack.length - 1] || { v: S.tab };
const push = (r) => { S.stack.push(r); S.sheet = null; };
let nid = 100;

function dueChip(t) {
  if (t.due === null || t.due === undefined) return '';
  if (t.done) return `<span class="chip">${rel(t.due)}</span>`;
  if (t.due < 0) return `<span class="chip bad">${t.due === -1 ? 'due yesterday' : 'due ' + fmt(t.due)}</span>`;
  if (t.due === 0) return '<span class="chip today">due today</span>';
  return `<span class="chip">due ${rel(t.due)}</span>`;
}
const projChip = (t) => t.project ? `<span class="chip proj">${DB.projects[t.project].name}${t.section ? ' · ' + t.section : ''}</span>` : '';

function taskRow(t, o = {}) {
  const carried = o.carried && t.from < S.day ? `<span>from ${rel(t.from)}</span>` : '';
  return `<div class="task${t.done ? ' done' : ''}">
    <button class="tick" data-act="tick" data-id="${t.id}" aria-label="${t.done ? 'Completed' : 'Mark done'}: ${esc(t.text)}"><i>${t.done ? '✓' : ''}</i></button>
    <button class="tbody" data-act="task" data-id="${t.id}"><span class="ttext">${esc(t.text)}</span>
      <span class="meta">${dueChip(t)}${o.noProj ? (t.section ? `<span class="chip">${t.section}</span>` : '') : projChip(t)}${t.person && !o.noPerson ? `<span>with ${P(t.person).name.split(' ')[0]}</span>` : ''}${carried}</span></button></div>`;
}
function commitRow(t, o = {}) {
  const p = P(t.owner);
  return `<div class="task${t.done ? ' done' : ''}">
    <button class="tick" data-act="tick" data-id="${t.id}" aria-label="Mark as done by ${p.name}"><i>${t.done ? '✓' : ''}</i></button>
    <button class="tbody" data-act="task" data-id="${t.id}"><span class="ttext">${esc(t.text)}</span>
      <span class="meta">${o.noName ? '' : `<span><b>${p.name.split(' ')[0]}</b></span>`}${dueChip(t)}${t.nudged !== undefined ? `<span class="chip ok">followed up ${rel(t.nudged)}</span>` : ''}</span></button>
    ${!t.done && t.nudged === undefined && t.due !== null && t.due <= 1 ? `<button class="btn mini" style="margin:9px 10px 0 0" data-act="nudge" data-id="${t.id}">Followed up</button>` : ''}</div>`;
}
const list = (rows) => `<div class="list">${rows.join('')}</div>`;
const group = (label, rows, cls = '') => rows.length ? `<section class="group"><h2 class="label ${cls}">${label} <span class="n">${rows.length}</span></h2>${list(rows)}</section>` : '';
function entryRow(e) {
  const ppl = e.people || (e.person ? [e.person] : []);
  const who = ppl.length ? `<span class="chip">${e.about ? 'about' : e.met ? 'met' : 'talked to'} ${ppl.map((x) => esc(P(x).name.split(' ')[0])).join(', ')}${e.how ? ' · ' + e.how.toLowerCase() : ''}</span>` : '';
  return `<div class="entry"><span class="when">${e.time}${who}${e.project ? `<span class="chip proj">${DB.projects[e.project].name}${e.section ? ' · ' + e.section : ''}</span>` : ''}${e.kind === 'task' ? '<span class="chip">task</span>' : ''}</span><span>${esc(e.text)}</span></div>`;
}

/* ============ screens ============ */
function vToday() {
  const d = S.day;
  const open = mine().filter((t) => !t.done);
  const ents = DB.entries.filter((e) => e.day === d).sort((a, b) => a.time.localeCompare(b.time, undefined, { numeric: true }));
  if (d < 0) { // an earlier day: the page as written, with what is still open marked, not copied
    const written = mine().filter((t) => t.from === d);
    return `${written.length ? `<section class="group"><h2 class="label">Tasks written this day</h2>${list(written.map((t) => taskRow(t)))}
      <p class="note-line" style="margin-top:6px">${written.filter((t) => !t.done).length} still open. They show on today’s page as well: the same task, with its date unchanged.</p></section>` : ''}
      <section class="group"><h2 class="label">Page</h2>${list(ents.map(entryRow))}</section>
      <button class="btn block" data-act="day" data-d="0">Back to today</button>`;
  }
  const carried = open.filter((t) => (t.due !== null && t.due < 0) || (t.due === null && t.from < 0 && t.from >= -3));
  const today = open.filter((t) => t.due === 0);
  const doneToday = mine().filter((t) => t.done && t.due === 0);
  const css = DB.projects.css;
  const cssMine = open.filter((t) => t.project === 'css' && t.due !== null && t.due <= 4).length;
  const late = theirs('css').filter((t) => !t.done && t.due !== null && t.due < 0);
  const drafts = reviewItems('css').length;
  return `<button class="pin" data-act="project" data-id="css"><strong>${css.name}</strong>
      <span class="grow small" style="flex:1">${cssMine} of yours due this week${late.length ? ` · <span style="color:var(--bad);font-weight:600">${late.length} overdue from others</span>` : ''}${drafts ? ` · ${drafts} to review` : ''}</span><span class="chev">›</span></button>
    ${group('Carried over', carried.map((t) => taskRow(t, { carried: true })), carried.some((t) => t.due !== null && t.due < 0) ? 'bad' : '')}
    ${group('Due today', [...today, ...doneToday].map((t) => taskRow(t)))}
    <section class="group"><h2 class="label">Today’s page <button data-act="checkin">Mood · habits · skin</button></h2>
      <div class="list">${ents.map(entryRow).join('')}<textarea class="scratch" id="scratch" placeholder="Keep writing here. Plans, journal, anything." aria-label="Today’s page">${esc(DB.scratch)}</textarea></div></section>
    <p class="note-line">Coming up: ${open.filter((t) => t.due > 0 && t.due <= 3).map((t) => `${esc(t.text)} (${rel(t.due)})`).join(' · ') || 'nothing in the next three days'}. <button class="linkish" data-act="tab" data-tab="tasks">All tasks</button></p>`;
}

function vTasks() {
  const all = mine().filter((t) => S.tfilter === 'all' || t.project === S.tfilter);
  const open = all.filter((t) => !t.done);
  const g = (f) => open.filter(f).map((t) => taskRow(t));
  const done = all.filter((t) => t.done);
  const nTheirs = theirs().filter((t) => !t.done).length;
  return `<div class="pills scroll">${[['all', 'All'], ...Object.entries(DB.projects).map(([id, p]) => [id, p.name])].map(([id, n]) => `<button class="pill" aria-pressed="${S.tfilter === id}" data-act="tfilter" data-id="${id}">${n}</button>`).join('')}</div>
    ${group('Overdue', g((t) => t.due !== null && t.due < 0), 'bad')}
    ${group('Today', g((t) => t.due === 0))}
    ${group('This week', g((t) => t.due > 0 && t.due <= 4))}
    ${group('Later', g((t) => t.due > 4))}
    ${group('No date', g((t) => t.due === null))}
    ${done.length ? `<section class="group"><h2 class="label">Done <span class="n">${done.length}</span><button data-act="showdone">${S.showDone ? 'Hide' : 'Show'}</button></h2>${S.showDone ? list(done.map((t) => taskRow(t))) : ''}</section>` : ''}
    <p class="note-line">Only your own tasks are listed here. ${nTheirs} things other people committed to are kept in their project. <button class="linkish" data-act="project" data-id="css" data-ptab="tasks">See CSS</button></p>`;
}

function vProjects() {
  return `${list(Object.entries(DB.projects).map(([id, p]) => {
    const o = mine().filter((t) => t.project === id && !t.done).length, th = theirs(id).filter((t) => !t.done).length;
    return `<button class="row" data-act="project" data-id="${id}"><span class="av">${p.name.slice(0, 2)}</span><span class="grow"><b>${p.name}</b><span class="small">${p.kind} · ${o} of yours open${th ? ` · ${th} from others` : ''}</span></span><span class="chev">›</span></button>`;
  }))}<button class="btn block" data-act="soon" data-msg="New project: a name, and optionally a folder of notes you already have.">New project</button>
  <p class="note-line">A project holds its notes, files, meetings, tasks and people. Sections inside it (Events, Sponsors…) are optional.</p>`;
}

function reviewItems(pid) {
  const ms = DB.meetings.filter((m) => m.project === pid && m.status === 'draft').map((m) => ({ kind: 'meeting', id: m.id, title: `Meeting notes: ${m.title}`, sub: `${rel(m.day)} · ${m.decisions.length} decisions, ${m.actions.length} action items${m.confirm.some((c) => !c.pick) ? ' · ' + m.confirm.filter((c) => !c.pick).length + ' to confirm' : ''}` }));
  return [...ms, ...DB.review.filter((r) => r.project === pid)];
}

function vProject(r) {
  const id = r.id, p = DB.projects[id];
  const tabs = ['overview', 'tasks', 'meetings', 'notes', 'people'];
  const inSec = (x) => S.section === 'All' || x.section === S.section;
  const secs = p.sections.length ? `<div class="pills scroll">${['All', ...p.sections].map((s) => `<button class="pill" aria-pressed="${S.section === s}" data-act="section" data-id="${s}">${s}</button>`).join('')}</div>` : '';
  let body = '';
  if (S.ptab === 'overview') {
    const next = DB.meetings.filter((m) => m.project === id && m.status === 'upcoming')[0];
    const rv = reviewItems(id);
    const my = mine().filter((t) => t.project === id && !t.done && t.due !== null && t.due <= 4).sort((a, b) => a.due - b.due);
    const th = theirs(id).filter((t) => !t.done && t.due !== null && t.due <= 4).sort((a, b) => a.due - b.due);
    const decs = DB.decisions.filter((d) => d.project === id).sort((a, b) => b.day - a.day);
    body = `${rv.length ? `<section class="group"><h2 class="label" style="color:var(--draft)">To review <span class="n">${rv.length}</span></h2>${rv.map((x) => `<div class="card draft"><span class="meta"><span class="chip draft">Draft · from Claude</span></span><b>${esc(x.title)}</b><span class="small">${esc(x.sub)}</span>
        <div class="pills">${x.kind === 'meeting' ? `<button class="btn mini primary" data-act="meeting" data-id="${x.id}">Open and review</button>` : `<button class="btn mini primary" data-act="accept-review" data-id="${x.id}">Accept</button><button class="btn mini" data-act="discard-review" data-id="${x.id}">Discard</button>`}</div></div>`).join('<div style="height:8px"></div>')}</section>` : ''}
      ${next ? `<section class="group"><h2 class="label">Next meeting</h2><button class="card" data-act="meeting" data-id="${next.id}"><b>${next.title} · ${rel(next.day)}</b><span class="small">${next.agenda ? next.agenda.length + ' agenda items drafted' : 'No agenda yet'} · ${th.filter((t) => t.due <= next.day).length} commitments due by then</span></button></section>` : ''}
      ${group('Yours this week', my.map((t) => taskRow(t, { noProj: true })))}
      ${group('Others this week', th.map((t) => commitRow(t)), th.some((t) => t.due < 0) ? 'bad' : '')}
      <section class="group"><h2 class="label">Decisions</h2>${list(decs.map((d) => `<div class="entry"><span>${d.superseded ? `<s>${esc(d.text)}</s>` : esc(d.text)}</span><span class="when">${rel(d.day)}${d.meeting ? ` · ${DB.meetings.find((m) => m.id === d.meeting).title}` : ''}${d.superseded ? ' · replaced' : ''}${d.corrects ? ' · correction' : ''}</span></div>`))}</section>
      <button class="btn block" data-act="copy-brief">Copy briefing for an AI chat</button>`;
  } else if (S.ptab === 'tasks') {
    const my = mine().filter((t) => t.project === id && !t.done && inSec(t)).sort((a, b) => (a.due ?? 99) - (b.due ?? 99));
    const byOwner = {};
    theirs(id).filter((t) => inSec(t)).forEach((t) => (byOwner[t.owner] ||= []).push(t));
    body = `${secs}${group('Yours', my.map((t) => taskRow(t, { noProj: true })))}
      ${Object.entries(byOwner).map(([o, ts]) => `<section class="group"><h2 class="label">${P(o).name} <span class="n">${ts.filter((t) => !t.done).length} open</span><button data-act="person" data-id="${o}">Open</button></h2>${list(ts.sort((a, b) => (a.due ?? 99) - (b.due ?? 99)).map((t) => commitRow(t, { noName: true })))}</section>`).join('')}
      <p class="note-line">Other people’s commitments never enter your own lists. Tick one when they have done it; “Followed up” records that you asked.</p>`;
  } else if (S.ptab === 'meetings') {
    const ms = DB.meetings.filter((m) => m.project === id).sort((a, b) => b.day - a.day);
    body = list(ms.map((m) => `<button class="row" data-act="meeting" data-id="${m.id}"><span class="grow"><b>${m.title}</b><span class="meta"><span>${rel(m.day)}</span>${m.status === 'draft' ? '<span class="chip draft">Draft · to review</span>' : m.status === 'upcoming' ? `<span class="chip">upcoming${m.agenda ? ' · agenda drafted' : ''}</span>` : '<span class="chip ok">accepted</span>'}${m.file ? '<span>transcript attached</span>' : ''}</span></span><span class="chev">›</span></button>`)) +
      `<p class="note-line">Each meeting keeps its summary, decisions, action items and the transcript it came from in one place.</p>`;
  } else if (S.ptab === 'notes') {
    const caps = DB.entries.filter((e) => e.project === id && inSec(e) && !e.person).map((e) => ({ title: e.text, day: e.day, section: e.section, cap: true }));
    const items = [...DB.notes.filter((n) => n.project === id && inSec(n)).map((n) => ({ ...n, note: true })), ...DB.files.filter((f) => f.project === id && inSec(f)).map((f) => ({ ...f, file: true })), ...caps].sort((a, b) => b.day - a.day);
    body = `${secs}${list(items.map((x) => `<button class="row" ${x.note ? `data-act="note" data-id="${x.id}"` : x.cap ? 'data-act="day" data-d="' + x.day + '"' : 'data-act="soon" data-msg="Opens the file, as the Files screen does now."'}><span class="grow"><span>${x.file ? '📎 ' : ''}${esc(x.title)}</span><span class="small">${x.cap ? 'from your daily page · ' : ''}${rel(x.day)}${x.section ? ' · ' + x.section : ''}</span></span><span class="chev">›</span></button>`))}`;
  } else {
    body = list(p.people.map((pid) => { const q = P(pid); const n = DB.tasks.filter((t) => t.owner === pid && t.project === id && !t.done).length;
      return `<button class="row" data-act="person" data-id="${pid}"><span class="av">${initials(q.name)}</span><span class="grow"><b>${q.name}</b><span class="small">${q.role} · last talked ${rel(q.talked)}${n ? ` · ${n} open commitments` : ''}</span></span><span class="chev">›</span></button>`; }));
  }
  return `<div class="seg" role="tablist">${tabs.map((t) => `<button aria-pressed="${S.ptab === t}" data-act="ptab" data-id="${t}">${t === 'notes' ? 'Notes & files' : t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>${body}`;
}

function vMeeting(r) {
  const m = DB.meetings.find((x) => x.id === r.id);
  if (m.status === 'upcoming') {
    const due = theirs(m.project).filter((t) => !t.done && t.due !== null && t.due <= m.day);
    return `<p class="small">${fmt(m.day)} · with ${m.who.map((w) => P(w).name.split(' ')[0]).join(', ')}</p>
      ${m.agenda ? `<div class="card draft"><span class="meta"><span class="chip draft">Draft agenda · from Claude</span></span><div class="prose"><ul>${m.agenda.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div></div>` : `<div class="card"><b>No agenda yet</b><span class="small">Ask an AI “what should we cover on Thursday?” and it drafts one here from open commitments and unconfirmed items. Or write your own.</span><button class="btn mini" style="align-self:flex-start" data-act="ai">See that conversation</button></div>`}
      ${group('Due from others by then', due.map((t) => commitRow(t)))}`;
  }
  const draft = m.status === 'draft';
  const head = `<p class="meta"><span>${fmt(m.day)}</span>${draft ? '<span class="chip draft">Draft · from Claude</span>' : '<span class="chip ok">Accepted</span>'}<span>with ${m.who.map((w) => P(w).name.split(' ')[0]).join(', ')}</span></p>
    <div class="seg"><button aria-pressed="${S.mtab === 'summary'}" data-act="mtab" data-id="summary">Summary</button><button aria-pressed="${S.mtab === 'source'}" data-act="mtab" data-id="source">Transcript</button></div>`;
  if (S.mtab === 'source') return `${head}<div class="card"><span class="small">📎 ${m.file} · the text the summary was made from, kept with it</span><div class="mono">${esc(m.transcript)}</div></div>`;
  const left = m.confirm.filter((c) => !c.pick).length;
  return `${head}
    <div class="card"><div class="prose"><p>${esc(m.summary)}</p></div></div>
    ${m.confirm.length ? `<section class="group"><h2 class="label" style="color:var(--warn)">To confirm <span class="n">${left} left</span></h2>${m.confirm.map((c, i) => `<div class="card"><span>${esc(c.q)}</span><div class="pills">${c.opts.map((o) => `<button class="pill" aria-pressed="${c.pick === o}" data-act="confirm" data-id="${m.id}" data-i="${i}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('<div style="height:8px"></div>')}</section>` : ''}
    <section class="group"><h2 class="label">Decisions</h2>${list(m.decisions.map((d) => `<div class="entry">${esc(d)}</div>`))}</section>
    ${m.actions.length ? `<section class="group"><h2 class="label">Action items</h2>${list(m.actions.map((a) => `<div class="entry"><span>${esc(a.text)}</span><span class="when"><b>${a.owner === 'me' ? 'You' : P(a.owner).name.split(' ')[0]}</b> · due ${rel(a.due)} · ${a.owner === 'me' ? 'goes to your tasks' : 'stays in CSS as their commitment'}</span></div>`))}</section>` : ''}
    ${draft ? `<div class="pills"><button class="btn primary" style="flex:1" data-act="accept-meeting" data-id="${m.id}">Accept</button><button class="btn" data-act="soon" data-msg="Opens the note in the editor. Your edits are kept and the draft label stays until you accept.">Edit</button></div>
      <p class="note-line">Until you accept, none of this is in your task list or the project’s decisions. The AI can also accept it for you when you say so in the chat.</p>` : ''}`;
}

function vPerson(r) {
  const p = P(r.id);
  const owes = DB.tasks.filter((t) => t.owner === r.id && !t.done);
  const with_ = mine().filter((t) => t.person === r.id && !t.done);
  return `<div class="row" style="padding:0"><span class="av big">${initials(p.name)}</span><span class="grow"><b style="font-size:17px">${p.name}</b><span class="small">${[esc(p.role), 'last talked ' + rel(p.talked), p.via ? 'met through ' + P(p.via).name.split(' ')[0] : '', p.al?.length ? 'also called ' + p.al.join(', ') : ''].filter(Boolean).join(' · ')}</span></span></div>
    <div class="pills"><button class="btn primary" style="flex:1" data-act="capture" data-kind="talk" data-person="${r.id}">We talked…</button><button class="btn" style="flex:1" data-act="capture" data-kind="talk" data-mode="fact" data-person="${r.id}">Remember…</button></div>
    ${about(r.id)}

/* loose facts about a person, sorted into headings (in the real app the AI proposes this; here a keyword sketch) */
const FACT_HEADS = ['Likes', 'Dislikes', 'Allergies', 'Dates', 'Other'];
function factHead(t) {
  if (/allerg/i.test(t)) return 'Allergies';
  if (/(doesn.t|does not|hates?|dislikes?|can.t stand|won.t|avoids?)/i.test(t)) return 'Dislikes';
  if (/(birthday|anniversary|visiting|exam|graduat|\b(jan(uary)?|feb(ruary)?|mar(ch)?|apr(il)?|june?|july?|aug(ust)?|sept?(ember)?|oct(ober)?|nov(ember)?|dec(ember)?)\b|\b\d{1,2}(st|nd|rd|th)\b)/i.test(t)) return 'Dates';
  if (/(likes?|loves?|into|favou?rite|training|enjoys?|fan of)/i.test(t)) return 'Likes';
  return 'Other';
}

  tfilter: (d) => { S.tfilter = d.id; }, ftype: (d) => { S.ftype = d.id; }, q: (d) => { S.q = d.id; },

  tick: (d) => { const t = task(d.id); t.done = !t.done; if (t.done && S.sheet?.v === 'task') S.sheet = null; if (t.done) toast(t.owner === 'me' ? 'Done. Tap again to undo.' : `Marked as done by ${P(t.owner).name.split(' ')[0]}.`); },
  nudge: (d) => { task(d.id).nudged = 0; toast('Noted that you followed up today.'); },
  task: (d) => { S.sheet = { v: 'task', id: d.id }; },
  close: (d, e) => { if (e.target.classList.contains('scrim')) S.sheet = null; else return false; },
  'close-btn': () => { S.sheet = null; },
  'set-due': (d) => { task(S.sheet.id).due = d.d === 'null' ? null : +d.d; },
  'set-proj': (d) => { const t = task(S.sheet.id); t.project = d.p === 'null' ? null : d.p; t.section = undefined; if (t.owner !== 'me' && (!t.project || !DB.projects[t.project].people.includes(t.owner))) t.owner = 'me'; },
  'set-owner': (d) => { const t = task(S.sheet.id); t.owner = d.o; if (d.o !== 'me') toast(`Moved to ${P(d.o).name.split(' ')[0]}’s commitments${t.project ? ' in ' + DB.projects[t.project].name : ''}.`); },
  capture: (d) => { S.sheet = { v: 'capture', kind: d.kind || 'note', mode: d.mode || 'talk', text: '', file: route().v === 'project' ? { p: route().id } : null, fq: '', people: d.person ? [d.person] : [], pq: '', newName: null, info: '', via: null, viaq: '', fu: null, due: null }; S.sheet.focus = S.sheet.kind === 'talk' && !d.person ? 'cpq' : 'ctext'; },
  'cap-kind': (d) => { const c = S.sheet; c.kind = d.id; c.focus = d.id === 'talk' && !c.people.length && !c.newName ? 'cpq' : 'ctext'; },
  'cap-mode': (d) => { S.sheet.mode = d.id; S.sheet.focus = 'ctext'; },
  'cap-add-person': (d) => { const c = S.sheet; c.people.push(d.id); c.pq = ''; c.focus = 'ctext'; },
  'cap-rm-person': (d) => { const c = S.sheet; c.people = c.people.filter((x) => x !== d.id); },
  'cap-new-person': () => { const c = S.sheet; c.newName = c.pq.trim(); c.pq = ''; c.focus = 'cinfo'; },
  'cap-rm-new': () => { Object.assign(S.sheet, { newName: null, info: '', via: null, viaq: '' }); },
  'cap-via': (d) => { S.sheet.via = d.id; S.sheet.viaq = ''; S.sheet.focus = 'ctext'; }, 'cap-via-clear': () => { S.sheet.via = null; },
  'cap-due': (d) => { S.sheet.due = d.d === 'null' ? null : +d.d; },
  'cap-file': (d) => { S.sheet.file = { p: d.p, s: d.s || undefined }; S.sheet.fq = ''; }, 'cap-file-clear': () => { S.sheet.file = null; },
  'cap-new-proj': () => { const c = S.sheet, id = 'p' + nid++; DB.projects[id] = { name: c.fq.trim(), kind: 'Personal', sections: [], people: [] }; c.file = { p: id }; c.fq = ''; },
  'cap-fu': () => { S.sheet.fu = { who: 'me', text: '', due: null }; S.sheet.focus = 'cfu'; }, 'cap-fu-off': () => { S.sheet.fu = null; },
  'cap-fu-who': (d) => { S.sheet.fu.who = d.id; }, 'cap-fu-due': (d) => { S.sheet.fu.due = d.d === 'null' ? null : +d.d; },
  'cap-save': () => { const c = S.sheet; let text = c.text.trim(); const proj = c.file?.p ?? null, section = c.file?.s;
    if (c.kind !== 'talk') { if (!text) return toast('Nothing written yet.');
      if (c.kind === 'task') { DB.tasks.push({ id: 't' + nid++, text, due: c.due, from: 0, owner: 'me', project: proj, section }); toast(c.due === 0 ? 'Task added to today.' : 'Task added. It is in Tasks' + (proj ? ' and ' + DB.projects[proj].name : '') + '.'); }
      else { DB.entries.push({ id: 'e' + nid++, day: 0, time: nowTime(), text, project: proj, section, capture: true }); toast(proj ? `Saved to today and ${fileLabel(c.file)}.` : 'Saved to today’s page.'); } }
    else { const people = [...c.people]; let made = null; const fact = c.mode === 'fact';
      if (!people.length && !c.newName) return toast('Pick or add a person first.');
      if (!text && (fact || !c.newName)) return toast('Nothing written yet.');
      if (c.newName) { made = 'x' + nid++; DB.people[made] = { name: c.newName, al: [], role: c.info.trim(), talked: 0, via: c.via, log: [], facts: {}, loose: [] }; people.push(made); if (proj && !fact) DB.projects[proj].people.push(made); }
      const names = people.length > 1 ? 'their pages' : P(people[0]).name.split(' ')[0] + '’s page';
      if (fact) { people.forEach((id) => (P(id).loose ||= []).unshift({ d: 0, text }));
        DB.entries.push({ id: 'e' + nid++, day: 0, time: nowTime(), text, people, person: people[0], about: true });
        toast(`${made ? c.newName + ' added. ' : ''}Kept on ${names}, unsorted for now.`); }
      else { if (!text) text = `Met ${c.newName}${c.via ? ' through ' + P(c.via).name.split(' ')[0] : ''}.`;
        DB.entries.push({ id: 'e' + nid++, day: 0, time: nowTime(), text, project: proj, section, people, person: people[0], met: !!made && people.length === 1 });
        people.forEach((id) => { const p = P(id); p.talked = 0; p.log.unshift({ d: 0, how: id === made ? 'Met' : 'Talked', text }); });
        const fu = c.fu && c.fu.text.trim();
        if (fu) DB.tasks.push(c.fu.who === 'me' ? { id: 't' + nid++, text: fu, due: c.fu.due, from: 0, owner: 'me', person: people[0], project: proj, section } : { id: 'c' + nid++, text: fu, due: c.fu.due, from: 0, owner: people[0], project: proj, section });
        toast(`${made ? c.newName + ' added. ' : ''}Logged on today’s page and on ${names}.${fu ? (c.fu.who === 'me' ? ' Follow-up is in your tasks.' : ' Their follow-up is on their page.') : ''}`); } }
    if (proj) S.lastFile = proj; S.sheet = null; },
  tidy: (d) => { const p = P(d.id); p.tidy = (p.loose || []).map((l) => ({ text: l.text, head: factHead(l.text) })); },
  'tidy-head': (d) => { const t = P(d.id).tidy[+d.i]; t.head = FACT_HEADS[(FACT_HEADS.indexOf(t.head) + 1) % FACT_HEADS.length]; },
  'tidy-accept': (d) => { const p = P(d.id); p.facts ||= {}; p.tidy.forEach((t) => (p.facts[t.head] ||= []).push(t.text)); p.loose = []; p.tidy = null; toast('Sorted. The original lines stay in the page’s history.'); },
  'tidy-discard': (d) => { P(d.id).tidy = null; },
  confirm: (d) => { const c = DB.meetings.find((m) => m.id === d.id).confirm[+d.i]; c.pick = c.pick === d.o ? null : d.o; },
  'accept-meeting': (d) => { const m = DB.meetings.find((x) => x.id === d.id); m.status = 'accepted';
    m.actions.forEach((a) => DB.tasks.push({ id: (a.owner === 'me' ? 't' : 'c') + nid++, text: a.text, due: a.due, from: m.day, owner: a.owner, project: m.project, section: a.section, meeting: m.id }));
    m.decisions.forEach((x) => DB.decisions.push({ id: 'd' + nid++, text: x, day: m.day, project: m.project, meeting: m.id }));
    const mineN = m.actions.filter((a) => a.owner === 'me').length; toast(`Accepted. ${mineN} tasks added to your list, ${m.actions.length - mineN} commitments to CSS, ${m.decisions.length} decisions recorded.`); },
  'accept-review': (d) => { acceptReview(d.id); toast('Accepted. The earlier decision is kept as replaced.'); },
  'discard-review': (d) => { DB.review = DB.review.filter((x) => x.id !== d.id); toast('Draft discarded. Nothing else changed.'); },
  'file-to': (d) => { const e = DB.entries.find((x) => x.id === d.id); e.project = d.p; toast(`Filed under ${DB.projects[d.p].name}.`); },
  'to-task': (d) => { const e = DB.entries.find((x) => x.id === d.id); e.kept = true; DB.tasks.push({ id: 't' + nid++, text: e.text, due: null, from: e.day, owner: 'me', project: null }); toast('Now a task with no date.'); },
  keep: (d) => { DB.entries.find((x) => x.id === d.id).kept = true; },
  checkin: () => toast('Opens mood, habits and the skin log: the screens you have now, one tap from here.'),
  soon: (d) => toast(d.msg),
  'copy-brief': () => { const txt = 'CSS briefing, Wed Nov 11: mine due this week…'; (navigator.clipboard?.writeText(txt) || Promise.reject()).catch(() => {}); toast('Briefing copied. Paste it into any AI chat on your phone.'); },
  'guide-open': () => { document.getElementById('guide').classList.add('open'); return false; },
  'guide-close': () => { document.getElementById('guide').classList.remove('open'); return false; },
  flow: (d) => { S.flow = +d.i; FLOWS[S.flow].go(); document.getElementById('guide').classList.remove('open'); },
  reset: () => { DB = fresh(); Object.assign(S, { tab: 'today', stack: [], day: 0, sheet: null, ai: 0, q: '', ftype: 'All', tfilter: 'all' }); toast('Sample data reset.'); },
};

/* ============ guide ============ */
const home = () => { S.tab = 'today'; S.stack = []; S.day = 0; S.sheet = null; };

    y: ['Tick “Finish patho case study draft”.', 'Tap ‹ at the top to see yesterday’s page, and how its open task is marked.', 'Tap the CSS strip to jump into the project.'] },
  { t: 'Capture something', go: () => { home(); ACT.capture({}); },
    b: ['A new task means opening a note, typing a line, then pressing the toolbar’s task button.', '“Talked to someone” means People → find the person → Log a conversation.', 'New note asks for a tag before you can type.'],
    n: ['One button, one box. Say what kind it is with one tap, or just save it.', 'Person covers the cases: someone you know (found by name or nickname as you type), someone new (name, basic info, who you met them through), a follow-up that came out of it (yours or theirs), and something to remember about them.', 'Things to remember are thrown in loose. “Tidy up” on their page sorts them into likes, dislikes, allergies and dates as a draft you accept.', 'File under searches every project and section, or makes a new project. It can stay empty; unfiled captures wait under Find → Unsorted.'],
    y: ['Person → type “mags”: Maya is found by her nickname. Write what it was about, add a follow-up, save.', 'Person → type “Sam Park” → Add as a new person. Basic info, then Met through “pri”.', 'Person → Maya → “Something to remember” → “loves dumplings” → save.', 'Find → Maya → Loose notes → Tidy up → Accept.', 'File under: type “spon” to pick CSS › Sponsors.'] },
  { t: 'Open and edit a task', go: () => { home(); S.sheet = { v: 'task', id: 't1' }; },
    b: ['At phone width a task row has six tap targets (tick, text, hide, date, priority, arrow) and the words get about 110 px.', 'The arrow unfolds a panel inside the list that measured 1,727 px tall, over two screens, with 28 controls.', 'Tapping the words edits them in place, which is easy to trigger by accident.'],

    y: ['Overview: see Priya’s overdue item and press “Followed up”.', 'Tasks tab: filter by the Events section.', 'People tab → Maya.'] },
  { t: 'File a meeting from a transcript', go: () => { ACT.project({ id: 'css', ptab: 'meetings' }); ACT.meeting({ id: 'm3' }); },
    b: ['A summary becomes an ordinary note under 20-css/meetings. The transcript is a separate note or file with no link back.', 'Action items for other people either become your tasks or stay buried in prose.', 'Points the AI was unsure of look the same as everything else.'],
    n: ['A meeting keeps summary, decisions, action items and its transcript together.', 'AI-written notes arrive as a draft. Unclear points are listed for you to settle.', 'On Accept, your items go to your tasks and other people’s go to the project.'],
    y: ['Settle the two “To confirm” points.', 'Open the Transcript tab.', 'Press Accept, then look at Today and at CSS → Tasks.'] },
  { t: 'Ask an AI in a fresh conversation', go: () => { S.tab = 'projects'; S.stack = [{ v: 'project', id: 'css' }]; ACT.ai(); },
    b: ['The bridge offers 55 tools and no starting point, so each new chat needs telling what to look up.', 'Its rule is “only write when the user requests it”, so you have to keep asking it to save.'],

    y: ['Step through the four messages.', 'Then open CSS: the agenda, the corrected decision and the new task are there.'] },
  { t: 'Find things and sort captures', go: () => { S.tab = 'find'; S.stack = []; S.q = ''; S.ftype = 'All'; S.sheet = null; },

function renderGuide() {
  const f = FLOWS[S.flow];
  document.getElementById('gbtext').textContent = `${S.flow + 1}/7 · ${f.t}`;
  document.getElementById('guide').innerHTML = `<button class="btn mini gclose" data-act="guide-close">Close</button>
    <div><h2>Gordonite, rethought</h2><p>A clickable sketch of the proposed everyday flows. Sample day: Wed Nov 11. Every name and note is made up. Nothing is saved.</p></div>
    <div class="flows">${FLOWS.map((x, i) => `<button aria-pressed="${i === S.flow}" data-act="flow" data-i="${i}"><span class="k">${i + 1}</span><span>${x.t}</span></button>`).join('')}</div>
    <div class="gcard"><h3 class="b">In the app today</h3><ul>${f.b.map((x) => `<li>${x}</li>`).join('')}</ul>
      <h3 class="n">Proposed</h3><ul>${f.n.map((x) => `<li>${x}</li>`).join('')}</ul>
      <h3 class="t">Try it</h3><ol>${f.y.map((x) => `<li>${x}</li>`).join('')}</ol></div>
    <button class="btn" style="align-self:flex-start" data-act="reset">Reset sample data</button>`;
}

/* ============ render ============ */
const ICON = { today: 'M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', tasks: 'M4 4h16v16H4zM8.5 12.5l2.5 2.5 4.5-5', projects: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', find: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4' };
let lastKey = '';
function render() {
  const r = route();
  const titles = { today: S.day === 0 ? fmt(0).replace(',', '') : fmt(S.day).replace(',', ''), tasks: 'My tasks', projects: 'Projects', find: 'Find', unsorted: 'Unsorted captures', ai: 'Claude · new chat' };
  let title = titles[r.v], sub = '';
  if (r.v === 'today') sub = S.day === 0 ? 'Today' : rel(S.day) === fmt(S.day) ? `${-S.day} days ago` : 'Yesterday';
  if (r.v === 'project') { title = DB.projects[r.id].name; sub = DB.projects[r.id].kind + ' project'; }
  if (r.v === 'meeting') { const m = DB.meetings.find((x) => x.id === r.id); title = m.title; sub = DB.projects[m.project].name + ' · meeting'; }
  if (r.v === 'person') { title = P(r.id).name; sub = 'Person'; }
  if (r.v === 'note') { title = DB.notes.find((x) => x.id === r.id).title; sub = 'Note'; }
  const back = S.stack.length ? '<button class="iconbtn" data-act="back" aria-label="Back">‹</button>' : '';
  const dayNav = r.v === 'today' ? `<button class="iconbtn" data-act="day" data-d="${S.day - 1}" aria-label="Previous day" ${S.day <= -2 ? 'disabled' : ''}>‹</button><button class="iconbtn" data-act="day" data-d="${S.day + 1}" aria-label="Next day" ${S.day >= 0 ? 'disabled' : ''}>›</button>` : '';
  document.getElementById('top').innerHTML = `${back}<h1>${sub ? `<span class="sub">${sub}</span>` : ''}${esc(title)}</h1>${dayNav}<span class="saved" title="Everything is saved" role="img" aria-label="Everything is saved"></span>`;
  const V = { today: vToday, tasks: vTasks, projects: vProjects, find: vFind, project: vProject, meeting: vMeeting, person: vPerson, note: vNote, unsorted: vUnsorted, ai: vAI };
  const scr = document.getElementById('screen');
  const key = JSON.stringify(r) + S.day, top = scr.scrollTop;
  const hadQ = document.activeElement?.id === 'q';
  scr.innerHTML = V[r.v](r);
  scr.scrollTop = key === lastKey ? top : 0; lastKey = key;
  if (hadQ) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  document.getElementById('capbar').hidden = r.v === 'ai' || r.v === 'find' || S.day !== 0 && r.v === 'today';
  document.getElementById('tabs').innerHTML = [['today', 'Today'], ['tasks', 'Tasks'], null, ['projects', 'Projects'], ['find', 'Find']].map((t) => t ? `<button data-act="tab" data-tab="${t[0]}" ${S.tab === t[0] ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[t[0]]}"/></svg>${t[1]}</button>` : '<button class="plus" data-act="capture" aria-label="Capture">+</button>').join('');
  const ov = document.getElementById('overlay');
  const focusId = document.activeElement?.id, sel = document.activeElement?.selectionStart;
  ov.innerHTML = (S.sheet ? (S.sheet.v === 'task' ? sheetTask(S.sheet.id) : sheetCapture()) : '') + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  if (S.sheet) { const want = S.sheet.focus || focusId; S.sheet.focus = null; const c = want && ov.querySelector('#' + want);
    if (c) { c.focus(); const at = want === focusId && sel != null ? sel : c.value.length; try { c.setSelectionRange(at, at); } catch {} } }
  renderGuide();
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (el.classList.contains('scrim') && e.target !== el) return; // clicks inside a sheet that hit no control
  if (ACT[a](el.dataset, e) === false) return;
  render();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'ctext') S.sheet.text = e.target.value;
  else if (e.target.id === 'cinfo') S.sheet.info = e.target.value;
  else if (e.target.id === 'cfu') S.sheet.fu.text = e.target.value;
  else if (e.target.id === 'cpq') { S.sheet.pq = e.target.value; render(); }
  else if (e.target.id === 'cfq') { S.sheet.fq = e.target.value; render(); }
  else if (e.target.id === 'cviaq') { S.sheet.viaq = e.target.value; render(); }
  else if (e.target.id === 'ttext') task(S.sheet.id).text = e.target.value;
  else if (e.target.id === 'scratch') DB.scratch = e.target.value;
  else if (e.target.id === 'q') { S.q = e.target.value; render(); }
});
render();
</script>
